    /*************************************************************************
     * 2.B FIREBASE REAL-TIME CLOUD SYNCHRONIZATION ENGINE
     *************************************************************************/
    async function loadFirebaseSDK() {
      if (window.__firebaseSDK) return true;
      const base = 'https://www.gstatic.com/firebasejs/11.6.1/';
      const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('انتهت مهلة تحميل Firebase')), ms))]);
      try {
        const [a, au, fs] = await withTimeout(Promise.all([
          import(base + 'firebase-app.js'),
          import(base + 'firebase-auth.js'),
          import(base + 'firebase-firestore.js')
        ]), 20000);
        window.__firebaseSDK = {
          initializeApp: a.initializeApp,
          getAuth: au.getAuth, signInAnonymously: au.signInAnonymously, signInWithCustomToken: au.signInWithCustomToken,
          getFirestore: fs.getFirestore, doc: fs.doc, setDoc: fs.setDoc, getDoc: fs.getDoc,
          deleteDoc: fs.deleteDoc, collection: fs.collection, onSnapshot: fs.onSnapshot
        };
        return true;
      } catch (e) {
        console.error('Firebase SDK load error', e);
        showToast('تعذر الاتصال بالحفظ السحابي: ' + (e.message || e), 'error');
        return false;
      }
    }

    window.initCloudSync = async function() {
      try {
        if (FIREBASE_ENABLED) await loadFirebaseSDK();
        if (!FIREBASE_ENABLED || !window.__firebaseSDK) {
          appState.cloud.isSyncing = false;
          renderAppIfSafe();
          return;
        }

        const {
          initializeApp,
          getAuth,
          signInAnonymously,
          signInWithCustomToken,
          getFirestore,
          collection,
          onSnapshot
        } = window.__firebaseSDK;

        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db = getFirestore(app);

        appState.cloud.db = db;

        // RULE 3: Authenticate FIRST with resilient fallback so auth never fails
        try {
          await signInAnonymously(auth);
        } catch (authError) {
          console.warn('Custom token auth fallback to anonymous:', authError);
          await signInAnonymously(auth);
        }

        appState.cloud.user = auth.currentUser;
        if (!appState.cloud.user) {
          appState.cloud.isSyncing = false;
          renderAppIfSafe();
          return;
        }

        appState.cloud.isConnected = true;

        // Flush any edits the teacher made before authentication completed
        const pendingKeys = Object.keys(appState.cloud.pendingQueue);
        if (pendingKeys.length > 0) {
          for (const key of pendingKeys) {
            await syncCoreDoc(key, appState.cloud.pendingQueue[key]);
            delete appState.cloud.pendingQueue[key];
          }
        }

        const appId = appState.cloud.appId;

        // RULE 1: Strict Public Paths
        const coreColRef = collection(db, 'artifacts', appId, 'public', 'data', 'bible_core');
        const attemptsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'bible_attempts');

        let coreInitialized = false;
        let attemptsInitialized = false;

        // Listen to Core Platform Data (settings, teams, users, exams, pointsLog)
        onSnapshot(
          coreColRef,
          async (snapshot) => {
            if (!appState.cloud.user) return;

            if (snapshot.empty && !coreInitialized) {
              coreInitialized = true;
              await pushAllCoreToCloud();
              appState.cloud.isSyncing = false;
              renderAppIfSafe();
              return;
            }

            coreInitialized = true;
            snapshot.forEach((docSnap) => {
              const data = docSnap.data();
              const id = docSnap.id;
              // Do not overwrite if this specific key is currently in pendingQueue
              if (appState.cloud.pendingQueue[id]) return;

              if (id === 'settings' && data.payload) {
                appState.settings = { ...appState.settings, ...data.payload };
                document.title = appState.settings.platformName;
              } else if (id === 'teams' && Array.isArray(data.list)) {
                appState.teams = data.list;
              } else if (id === 'users' && Array.isArray(data.list)) {
                appState.users = data.list;
                if (appState.currentUser) {
                  const updatedMe = appState.users.find(u => u.id === appState.currentUser.id);
                  if (updatedMe) {
                    appState.currentUser = updatedMe;
                  }
                }
              } else if (id === 'exams' && Array.isArray(data.list)) {
                appState.exams = data.list;
              } else if (id === 'pointsLog' && Array.isArray(data.list)) {
                appState.pointsLog = data.list;
              }
            });

            appState.cloud.isConnected = true;
            appState.cloud.isSyncing = false;
            renderAppIfSafe();
          },
          (err) => {
            console.error('Core Sync Error:', err);
            showToast('خطأ في قراءة البيانات: ' + (err.code || err.message), 'error');
            appState.cloud.isSyncing = false;
            renderAppIfSafe();
          }
        );

        // Listen to Student Attempts Collection in Real Time
        onSnapshot(
          attemptsColRef,
          async (snapshot) => {
            if (!appState.cloud.user) return;

            if (snapshot.empty && !attemptsInitialized) {
              attemptsInitialized = true;
              for (const att of appState.attempts) {
                await saveAttemptToCloud(att);
              }
              return;
            }

            attemptsInitialized = true;
            const loadedAttempts = [];
            snapshot.forEach((docSnap) => {
              const d = docSnap.data();
              if (d && d.id) {
                loadedAttempts.push(d);
              }
            });

            // لا نسمح لنسخة قديمة "جاري الامتحان" بأن تلغي نتيجة منتهية محلياً
            const mergedAttempts = loadedAttempts.map(inc => {
              if (inc.status !== 'in_progress') return inc;
              const local = appState.attempts.find(l => l.id === inc.id);
              return (local && local.status !== 'in_progress') ? local : inc;
            });
            mergedAttempts.sort((a, b) => (b.timestampMs || 0) - (a.timestampMs || 0));
            appState.attempts = mergedAttempts;
            renderAppIfSafe();
          },
          (err) => {
            console.error('Attempts Sync Error:', err);
          }
        );
      } catch (e) {
        console.error('Cloud Init Error:', e);
        showToast('خطأ في الاتصال بقاعدة البيانات: ' + (e.code || e.message || e), 'error');
        appState.cloud.isSyncing = false;
        renderAppIfSafe();
      }
    };

    // Avoid interrupting a student's active exam question DOM unless needed
    function renderAppIfSafe() {
      if (appState.examSession && !appState.examSession.isLocked) {
        return;
      }
      renderApp();
    }

    async function syncCoreDoc(docKey, payloadData) {
      appState.cloud.hasLocalEdits = true;
      saveStateToLocalStorage();
      // If cloud is still connecting, queue the data so it is never lost
      if (!appState.cloud.user || !appState.cloud.db) {
        appState.cloud.pendingQueue[docKey] = payloadData;
        return;
      }
      try {
        appState.cloud.isSaving = true;
        const { doc, setDoc } = window.__firebaseSDK;
        const ref = doc(appState.cloud.db, 'artifacts', appState.cloud.appId, 'public', 'data', 'bible_core', docKey);
        await setDoc(ref, {
          ...payloadData,
          updatedAtMs: Date.now()
        });
        appState.cloud.isSaving = false;
        appState.cloud.lastSavedAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        updateSaveIndicatorDOM();
      } catch (e) {
        appState.cloud.isSaving = false;
        console.error(`Error syncing ${docKey}:`, e);
      }
    }

    async function pushAllCoreToCloud(showNotification = false) {
      appState.cloud.isSaving = true;
      updateSaveIndicatorDOM();
      await Promise.all([
        syncCoreDoc('settings', { payload: appState.settings }),
        syncCoreDoc('teams', { list: appState.teams }),
        syncCoreDoc('users', { list: appState.users }),
        syncCoreDoc('exams', { list: appState.exams }),
        syncCoreDoc('pointsLog', { list: appState.pointsLog })
      ]);
      appState.cloud.isSaving = false;
      appState.cloud.lastSavedAt = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      updateSaveIndicatorDOM();
      if (showNotification) {
        showToast('تم حفظ جميع التعديلات والأسئلة والحسابات سحابياً بنجاح! ✓', 'success');
      }
    }

    function updateSaveIndicatorDOM() {
      const el = document.getElementById('cloud-save-status');
      if (!el) return;
      if (appState.cloud.isSaving) {
        el.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400"></i> <span>جاري الحفظ...</span>`;
      } else if (appState.cloud.lastSavedAt) {
        el.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>تم الحفظ (${appState.cloud.lastSavedAt})</span>`;
      }
    }

    const LOCAL_STORAGE_KEY = 'bible_prep_platform_state_v1';

    function saveStateToLocalStorage() {
      try {
        const snapshot = {
          settings: appState.settings,
          teams: appState.teams,
          users: appState.users,
          exams: appState.exams,
          attempts: appState.attempts,
          pointsLog: appState.pointsLog,
          savedAt: Date.now()
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(snapshot));
      } catch (e) {
        console.warn('Local storage save warning:', e);
      }
    }

    function loadStateFromLocalStorage() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (parsed.settings) appState.settings = { ...appState.settings, ...parsed.settings };
        if (Array.isArray(parsed.teams)) appState.teams = parsed.teams;
        if (Array.isArray(parsed.users)) appState.users = parsed.users;
        if (Array.isArray(parsed.exams)) appState.exams = parsed.exams;
        if (Array.isArray(parsed.attempts)) appState.attempts = parsed.attempts;
        if (Array.isArray(parsed.pointsLog)) appState.pointsLog = parsed.pointsLog;
        return true;
      } catch (e) {
        console.warn('Local storage load warning:', e);
        return false;
      }
    }

    // Export standalone HTML file with all current teacher changes baked directly into the code
    function downloadUpdatedSiteHTML() {
      try {
        saveStateToLocalStorage();
        let fullHtml = document.documentElement.outerHTML;
        const bakedDataScript = `
    window.__BAKED_INITIAL_STATE__ = ${JSON.stringify({
      settings: appState.settings,
      teams: appState.teams,
      users: appState.users,
      exams: appState.exams,
      attempts: appState.attempts,
      pointsLog: appState.pointsLog
    }, null, 2)};
        `;

        if (fullHtml.includes('/*__BAKED_STATE_MARKER_START__*/')) {
          fullHtml = fullHtml.replace(
            /\/\*__BAKED_STATE_MARKER_START__\*\/[\s\S]*?\/\*__BAKED_STATE_MARKER_END__\*\//,
            `/*__BAKED_STATE_MARKER_START__*/\n${bakedDataScript}\n/*__BAKED_STATE_MARKER_END__*/`
          );
        }

        const finalDoc = '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n' + fullHtml + '\n</html>';
        const blob = new Blob([finalDoc], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('تم تحميل ملف الموقع (index.html) وبداخله كل تعديلاتك وأسئلتك وحسابات الأولاد!', 'success');
      } catch (err) {
        console.error(err);
        showToast('حدث خطأ أثناء تجهيز الملف للتحميل', 'error');
      }
    }

      return (

        lower.startsWith('data:') ||
        lower.includes('usercontent.goog') ||
        lower.includes('null')

    // Check if current admin has a specific permission
    function hasPerm(permKey) {
      const user = appState.currentUser;
      if (!user) return false;
      if (user.role === 'super_admin') return true;
      if (user.role === 'sub_admin' && user.permissions && user.permissions[permKey]) return true;
      return false;
    }

    // Calculate a student's exam points across all exams
    function getStudentExamPoints(studentId) {
      return appState.attempts
        .filter(a => a.studentId === studentId)
        .reduce((sum, a) => sum + (Number(a.score) || 0), 0);
    }

    // Calculate a student's total points (Exam points + manual bonus/deduction points)
    function getStudentTotalPoints(student) {
      const examPts = getStudentExamPoints(student.id);
      const manualPts = Number(student.manualPoints) || 0;
      return examPts + manualPts;
    }

    // Calculate a team's total points (Sum of all member total points + team manual points)
    function getTeamStats(teamId) {
      const team = appState.teams.find(t => t.id === teamId);
      if (!team) return { membersCount: 0, membersPoints: 0, manualPoints: 0, totalPoints: 0, members: [] };
      const members = appState.users.filter(u => u.role === 'student' && u.teamId === teamId);
      const membersPoints = members.reduce((sum, m) => sum + getStudentTotalPoints(m), 0);
      const manualPoints = Number(team.manualPoints) || 0;
      return {
        membersCount: members.length,
        membersPoints,
        manualPoints,
        totalPoints: membersPoints + manualPoints,
        members
      };
    }

    // Get sorted Teams leaderboard
    function getTeamsLeaderboard() {
      return appState.teams.map(team => {
        const stats = getTeamStats(team.id);
        return {
          ...team,
          ...stats
        };
      }).sort((a, b) => b.totalPoints - a.totalPoints);
    }

    // Get sorted Students leaderboard
    function getStudentsLeaderboard() {
      return appState.users
        .filter(u => u.role === 'student')
        .map(stu => {
          const examPoints = getStudentExamPoints(stu.id);
          const manualPoints = Number(stu.manualPoints) || 0;
          const totalPoints = examPoints + manualPoints;
          const team = appState.teams.find(t => t.id === stu.teamId);
          return {
            ...stu,
            examPoints,
            manualPoints,
            totalPoints,
            teamName: team ? team.name : 'بدون فريق',
            teamColor: team ? team.color : '#64748b'
          };
        })
        .sort((a, b) => b.totalPoints - a.totalPoints);
    }

    // Subtle Web Audio beep for countdown/events
    function playTone(freq = 600, duration = 0.08, type = 'sine') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        // Ignore audio errors if blocked by browser autoplay policy
      }
    }

    function handleLogin(event) {
      if (event) event.preventDefault();
      const usernameInput = document.getElementById('login-username');
      const passwordInput = document.getElementById('login-password');
      const username = (usernameInput?.value || '').trim().toLowerCase();
      const password = (passwordInput?.value || '').trim();

      if (!username || !password) {
        showToast('من فضلك أدخل اسم المستخدم وكلمة المرور', 'warning');
        return;
      }

      const foundUser = appState.users.find(
        u => u.username.toLowerCase() === username && u.password === password
      );

      if (!foundUser) {
        showToast('بيانات الدخول غير صحيحة! تأكد من اسم المستخدم وكلمة المرور من المستر.', 'error');
        return;
      }

      appState.currentUser = foundUser;

      // Pick default first permitted tab for sub_admin
      if (foundUser.role === 'sub_admin') {
        appState.adminActiveTab = 'overview';
      } else if (foundUser.role === 'super_admin') {
        appState.adminActiveTab = 'overview';
      } else {
        appState.studentActiveTab = 'dashboard';
      }

      showToast(`أهلاً بك يا ${foundUser.name}!`, 'success');
      renderApp();
    }

    /*************************************************************************
     * 5. EXAM ENGINE & STRICT ANTI-CHEAT / AI BLOCKER
     *************************************************************************/
    function startStudentExam() {
      const user = appState.currentUser;
      if (!user || user.role !== 'student') return;

      if (appState.settings.isCompetitionEnded) {
        showToast('المسابقة انتهت بالفعل ولا يمكن دخول الامتحان.', 'warning');
        return;
      }

      if (!appState.settings.isExamOpen) {
        showToast('الامتحان مغلق حالياً من قِبل المستر.', 'warning');
        return;
      }

      const activeExam = appState.exams.find(e => e.id === appState.settings.activeExamId);
      if (!activeExam || activeExam.questions.length === 0) {
        showToast('لا توجد أسئلة مضافة في هذا الامتحان حتى الآن.', 'warning');
        return;
      }

      const existingAttempt = appState.attempts.find(
        a => a.examId === activeExam.id && a.studentId === user.id
      );

      if (existingAttempt) {

    function confirmAndLaunchExam() {
      closeModal();
      const user = appState.currentUser;
      const activeExam = appState.exams.find(e => e.id === appState.settings.activeExamId);
      if (!user || !activeExam) return;

      const firstQ = activeExam.questions[0];
      appState.examSession = {
        examId: activeExam.id,
        studentId: user.id,
        currentIndex: 0,
        answers: [],
        timeLeft: Number(firstQ.timeLimit) || 20,
        maxTime: Number(firstQ.timeLimit) || 20,
        questionStartTime: Date.now(),
        timerInterval: null,
        isLocked: false
      };

      persistProgress(appState.examSession);
      startQuestionTimer();
      renderApp();
    }

    function startQuestionTimer() {
      if (!appState.examSession) return;
      if (appState.examSession.timerInterval) {
        clearInterval(appState.examSession.timerInterval);
      }

      appState.examSession.timerInterval = setInterval(() => {
        const session = appState.examSession;
        if (!session || session.isLocked) {
          clearInterval(session?.timerInterval);
          return;
        }

        session.timeLeft -= 1;

        // Update timer DOM elements smoothly without full re-render
        const timerText = document.getElementById('exam-timer-seconds');
        const timerBar = document.getElementById('exam-timer-bar');
        const timerBadge = document.getElementById('exam-timer-badge');

        if (timerText) timerText.textContent = session.timeLeft;
        if (timerBar) {
          const pct = Math.max(0, (session.timeLeft / session.maxTime) * 100);
          timerBar.style.width = `${pct}%`;
          if (session.timeLeft <= 5) {
            timerBar.className = 'h-full bg-rose-500 transition-all duration-1000 ease-linear';
            if (timerBadge) timerBadge.classList.add('timer-critical', 'border-rose-500', 'text-rose-400');
            playTone(740, 0.06, 'triangle');
          }
        }

        if (session.timeLeft <= 0) {
          clearInterval(session.timerInterval);
          handleQuestionTimeout();
        }
      }, 1000);
    }

    function submitQuestionAnswer(selectedOption) {
      const session = appState.examSession;
      if (!session || session.isLocked) return;

      clearInterval(session.timerInterval);
      const activeExam = appState.exams.find(e => e.id === session.examId);
      const q = activeExam.questions[session.currentIndex];
      const timeSpent = Math.max(1, session.maxTime - session.timeLeft);
      const isCorrect = selectedOption === q.correctAnswer;
      const pointsEarned = isCorrect ? Number(q.points) : 0;

      session.answers.push({
        questionId: q.id,
        questionText: q.text,
        selectedOption,
        correctAnswer: q.correctAnswer,
        isCorrect,
        pointsEarned,
        maxPoints: Number(q.points),
        timeSpent,
        status: 'answered'
      });

      playTone(isCorrect ? 880 : 440, 0.08, 'sine');
      advanceToNextQuestionOrFinish();
    }

    function handleQuestionTimeout() {
      const session = appState.examSession;
      if (!session || session.isLocked) return;

      const activeExam = appState.exams.find(e => e.id === session.examId);
      const q = activeExam.questions[session.currentIndex];

      session.answers.push({
        questionId: q.id,
        questionText: q.text,
        selectedOption: 'انتهى الوقت دون إجابة',
        correctAnswer: q.correctAnswer,
        isCorrect: false,
        pointsEarned: 0,
        maxPoints: Number(q.points),
        timeSpent: session.maxTime,
        status: 'timeout'
      });

      showToast('انتهى وقت هذا السؤال! تم الانتقال للسؤال التالي تلقائياً.', 'warning');
      advanceToNextQuestionOrFinish();
    }

    function advanceToNextQuestionOrFinish() {
      const session = appState.examSession;
      if (!session) return;
      persistProgress(session);

      const activeExam = appState.exams.find(e => e.id === session.examId);
      if (session.currentIndex + 1 < activeExam.questions.length) {
        session.currentIndex += 1;
        const nextQ = activeExam.questions[session.currentIndex];
        session.timeLeft = Number(nextQ.timeLimit) || 20;
        session.maxTime = Number(nextQ.timeLimit) || 20;
        session.questionStartTime = Date.now();
        startQuestionTimer();
        renderApp();
      } else {
        finalizeExamAttempt('completed', null);
      }
    }

    // حفظ تقدم الطالب لحظياً: لو قفل الصفحة أو التطبيق يتحسب غشاش عند أول دخول تاني
    const liveAttemptIds = new Set(); // محاولات بدأت في هذه الصفحة (لا تُعتبر متروكة)
    function persistProgress(session) {
      if (!session) return;
      const exam = appState.exams.find(e => e.id === session.examId);
      if (!exam) return;
      liveAttemptIds.add(`att_${session.examId}_${session.studentId}`);
      const att = {
        id: `att_${session.examId}_${session.studentId}`,
        examId: session.examId,
        studentId: session.studentId,
        status: 'in_progress',
        kickReason: null,
        kickedAtQuestion: null,
        score: session.answers.reduce((s, a) => s + (Number(a.pointsEarned) || 0), 0),
        maxScore: exam.questions.reduce((s, q) => s + (Number(q.points) || 0), 0),
        submittedAt: 'جاري الامتحان',
        timestampMs: Date.now(),
        currentIndex: session.currentIndex,
        answers: [...session.answers]
      };
      appState.attempts = appState.attempts.filter(a => a.id !== att.id);
      appState.attempts.unshift(att);
      saveAttemptToCloud(att);
    }

    function abandonStaleAttempts() {
      const user = appState.currentUser;
      if (!user || user.role !== 'student' || appState.examSession) return;
      const stale = appState.attempts.filter(a => a.studentId === user.id && a.status === 'in_progress' && !liveAttemptIds.has(a.id));
      stale.forEach(att => {
        const exam = appState.exams.find(e => e.id === att.examId);
        const answers = [...(att.answers || [])];
        const startIdx = answers.length;
        if (exam) {
          for (let i = startIdx; i < exam.questions.length; i++) {
            const q = exam.questions[i];
            answers.push({
              questionId: q.id, questionText: q.text,
              selectedOption: i === startIdx ? 'خرج من الامتحان / قفل التطبيق' : 'ألغي بسبب الإخراج من الامتحان',
              correctAnswer: q.correctAnswer, isCorrect: false, pointsEarned: 0,
              maxPoints: Number(q.points), timeSpent: 0,
              status: i === startIdx ? 'kicked' : 'unanswered_kicked'
            });
          }
        }
        const fixed = {
          ...att,
          status: 'kicked_ai',
          kickReason: `قفل التطبيق أو الصفحة أو خرج من الامتحان (عند السؤال رقم ${startIdx + 1})`,
          kickedAtQuestion: startIdx + 1,
          submittedAt: 'تم الإخراج',
          timestampMs: Date.now(),
          answers
        };
        appState.attempts = appState.attempts.map(a => a.id === att.id ? fixed : a);
        saveAttemptToCloud(fixed);
        setTimeout(() => openModal(`
          <div class="text-center space-y-4">
            <div class="w-20 h-20 rounded-full bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center mx-auto text-rose-400 text-4xl"><i class="fa-solid fa-user-lock"></i></div>
            <h3 class="text-2xl font-black text-rose-400">تم إخراجك من الامتحان</h3>
            <p class="text-slate-300 text-sm leading-relaxed">لقد خرجت من شاشة الامتحان أو أغلقت التطبيق قبل ما تخلص، فاتحسبت محاولة غش وتم إبلاغ المستر.</p>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold">حسناً</button>
          </div>`), 50);
      });
    }

    function triggerAntiCheatKick(reasonText = 'محاولة الخروج من شاشة الامتحان أو فتح مساعد AI / نافذة خارجية') {
      const session = appState.examSession;
      if (!session || session.isLocked) return;
      if (!appState.settings.antiCheatEnabled) return;

      session.isLocked = true;
      if (session.timerInterval) clearInterval(session.timerInterval);

      const activeExam = appState.exams.find(e => e.id === session.examId);
      const kickedQuestionNum = session.currentIndex + 1;

      // Record remaining questions as kicked/cancelled
      for (let i = session.currentIndex; i < activeExam.questions.length; i++) {
        const q = activeExam.questions[i];
        const isCurrent = i === session.currentIndex;
        session.answers.push({
          questionId: q.id,
          questionText: q.text,
          selectedOption: isCurrent
            ? 'تم الإخراج لمحاولة فتح نافذة خارجية / AI'
            : 'ألغي بسبب الإخراج من الامتحان',
          correctAnswer: q.correctAnswer,
          isCorrect: false,
          pointsEarned: 0,
          maxPoints: Number(q.points),
          timeSpent: isCurrent ? Math.max(1, session.maxTime - session.timeLeft) : 0,
          status: isCurrent ? 'kicked' : 'unanswered_kicked'
        });
      }

      playTone(220, 0.35, 'sawtooth');
      finalizeExamAttempt(
        'kicked_ai',
        `${reasonText} (عند السؤال رقم ${kickedQuestionNum})`,
        kickedQuestionNum
      );
    }

    function finalizeExamAttempt(status, kickReason = null, kickedAtQuestion = null) {
      const session = appState.examSession;
      if (!session) return;

      if (session.timerInterval) clearInterval(session.timerInterval);

      const activeExam = appState.exams.find(e => e.id === session.examId);
      const totalScore = session.answers.reduce((sum, a) => sum + (Number(a.pointsEarned) || 0), 0);
      const maxScore = activeExam.questions.reduce((sum, q) => sum + (Number(q.points) || 0), 0);
      const docId = `att_${session.examId}_${session.studentId}`;
      const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

      const newAttempt = {
        id: docId,
        examId: session.examId,
        studentId: session.studentId,
        status,
        kickReason,
        kickedAtQuestion,
        score: totalScore,
        maxScore,
        submittedAt: `اليوم ${nowTime}`,
        timestampMs: Date.now(),
        answers: [...session.answers]
      };

      // Update local state immediately and sync to Firestore
      appState.attempts = appState.attempts.filter(
        a => !(a.examId === session.examId && a.studentId === session.studentId)
      );
      appState.attempts.unshift(newAttempt);
      saveAttemptToCloud(newAttempt);

      appState.examSession = null;
      renderApp();

      if (status === 'kicked_ai') {
        openModal(`
          <div class="text-center space-y-4">
            <div class="w-20 h-20 rounded-full bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center mx-auto text-rose-400 text-4xl">
              <i class="fa-solid fa-user-lock"></i>
            </div>
            <h3 class="text-2xl font-black text-rose-400">تم إخراجك وإغلاق الامتحان فوراً!</h3>
            <p class="text-slate-300 text-sm leading-relaxed">
              اكتشف النظام محاولة الخروج من شاشة الامتحان أو فتح نافذة أخرى / مساعد ذكاء اصطناعي (AI).
            </p>
            <div class="bg-rose-950/70 border border-rose-500/40 rounded-xl p-4 text-sm text-rose-200 text-right space-y-1">
              <div><strong>السبب المسجل في التقرير:</strong> ${kickReason}</div>
              <div><strong>النقط المحتسبة قبل الإغلاق:</strong> ${totalScore} من ${maxScore}</div>
              <div><strong>حالة المحاولة:</strong> تم إرسال التقرير فوراً للمستر ولا يمكنك الدخول مرة أخرى إلا إذا سمح لك المستر.</div>
            </div>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold transition">
              العودة لصفحتي الشخصية
            </button>
          </div>
        `);
      } else {
        openModal(`
          <div class="text-center space-y-4">
            <div class="w-20 h-20 rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center mx-auto text-emerald-400 text-4xl">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-2xl font-black text-white">أحسنت! تم تسليم الامتحان بنجاح</h3>
            <p class="text-slate-300 text-sm">تم إرسال إجاباتك وتقريرك الكامل للمستر لحظياً وإضافة نقطك لرصيدك ولرصيد فريقك.</p>
            <div class="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-5">
              <div class="text-slate-400 text-xs mb-1">درجتك في الامتحان</div>
              <div class="text-4xl font-black text-amber-400">${totalScore} <span class="text-lg text-slate-400">/ ${maxScore} نقطة</span></div>
            </div>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold transition">
              عرض لوحة الشرف وترتيب الفرق
            </button>
          </div>
        `);
      }
    }

    // Global Anti-Cheat Listeners (active only when appState.examSession is active)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && appState.examSession && !appState.examSession.isLocked) {
        triggerAntiCheatKick('الخروج من المتصفح أو تبديل التاب لفتح برنامج خارجي / AI');
      }
    });

    // قفل الصفحة أو التطبيق أو عمل ريفريش أثناء الامتحان
    window.addEventListener('pagehide', () => {
      if (appState.examSession && !appState.examSession.isLocked) {
        triggerAntiCheatKick('قفل الصفحة أو التطبيق أو عمل ريفريش أثناء الامتحان');
      }
    });
    window.addEventListener('beforeunload', () => {
      if (appState.examSession && !appState.examSession.isLocked) {
        triggerAntiCheatKick('قفل الصفحة أو التطبيق أو عمل ريفريش أثناء الامتحان');
      }
    });

    window.addEventListener('blur', () => {
      // مهلة قصيرة تمنع الطرد الخاطئ لحظة بدء السؤال أو عند فقدان تركيز عابر
      const sess = appState.examSession;
      if (!sess || sess.isLocked) return;
      const startedAgo = Date.now() - (sess.questionStartTime || 0);
      if (startedAgo < 2000) return;
      setTimeout(() => {
        if (appState.examSession && !appState.examSession.isLocked && !document.hasFocus()) {
          triggerAntiCheatKick('فقدان التركيز من نافذة الامتحان (فتح نافذة منبثقة / تقسيم الشاشة / AI)');
        }
      }, 400);
    });

    document.addEventListener('contextmenu', (e) => {
      if (appState.examSession) {
        e.preventDefault();
        showToast('الكليك يمين والنسخ غير مسموح أثناء الامتحان!', 'error');
      }
    });

    document.addEventListener('copy', (e) => {
      if (appState.examSession) {
        e.preventDefault();
        showToast('نسخ الأسئلة ممنوع تماماً أثناء الامتحان!', 'error');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!appState.examSession) return;
      if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'u', 'p', 's', 'f'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        showToast('اختصارات النسخ والبحث ممنوعة داخل الامتحان!', 'error');
      }
    });

    function saveNewExam() {
      const title = document.getElementById('new-exam-title')?.value.trim();
      const desc = document.getElementById('new-exam-desc')?.value.trim() || 'مسابقة أسبوعية';
      const makeActive = document.getElementById('new-exam-make-active')?.checked;

      if (!title) {
        showToast('من فضلك اكتب عنوان الامتحان الأسبوعي', 'warning');
        return;
      }

      const newExam = {
        id: 'exam_' + Date.now(),
        title,
        description: desc,
        createdAt: new Date().toISOString().slice(0, 10),
        questions: []
      };

      appState.exams.push(newExam);
      appState.selectedExamForEdit = newExam.id;
      syncCoreDoc('exams', { list: appState.exams });

      if (makeActive) {
        appState.settings.activeExamId = newExam.id;
        appState.selectedExamForReport = newExam.id;
        syncCoreDoc('settings', { payload: appState.settings });
      }

      closeModal();
      showToast('تم إنشاء الامتحان الأسبوعي الجديد وحفظه سحابياً! أضف الأسئلة الآن.', 'success');
      renderApp();

    function deleteExam(examId) {
      if (!hasPerm('manageExams')) return;
      if (appState.exams.length <= 1) {
        showToast('لا يمكن مسح الامتحان الوحيد الموجود بالمنصة.', 'warning');
        return;
      }
      const removedAttempts = appState.attempts.filter(a => a.examId === examId);
      removedAttempts.forEach(a => deleteAttemptFromCloud(a.id));

      appState.exams = appState.exams.filter(e => e.id !== examId);
      appState.attempts = appState.attempts.filter(a => a.examId !== examId);
      if (appState.settings.activeExamId === examId) {
        appState.settings.activeExamId = appState.exams[0].id;
        syncCoreDoc('settings', { payload: appState.settings });
      }
      if (appState.selectedExamForEdit === examId) {
        appState.selectedExamForEdit = appState.exams[0].id;
      }
      syncCoreDoc('exams', { list: appState.exams });
      showToast('تم مسح الامتحان الأسبوعي بنجاح.', 'info');
      renderApp();
    }

            ${[0, 1, 2, 3].map(idx => {
              const val = opts[idx] || '';
              const isChecked = existingQ && existingQ.type === 'mcq' ? (val === existingQ.correctAnswer) : (idx === 0);
              return `
                <div class="flex items-center gap-2">

    function toggleQuestionModalType(type) {
      const mcqBox = document.getElementById('q-mcq-container');
      const tfBox = document.getElementById('q-tf-container');
      if (type === 'mcq') {
        mcqBox.classList.remove('hidden');
        mcqBox.classList.add('space-y-2.5');
        tfBox.classList.add('hidden');
      } else {
        tfBox.classList.remove('hidden');
        tfBox.classList.add('space-y-2');
        mcqBox.classList.add('hidden');
      }
    }

    function saveQuestion(examId, questionId = null) {
      const exam = appState.exams.find(e => e.id === examId);
      if (!exam) return;

      const type = document.getElementById('q-type').value;
      const timeLimit = Math.max(5, Number(document.getElementById('q-time').value) || 20);
      const points = Math.max(1, Number(document.getElementById('q-points').value) || 10);
      const text = document.getElementById('q-text').value.trim();
      const reference = document.getElementById('q-ref').value.trim();

      if (!text) {
        showToast('من فضلك اكتب نص السؤال', 'warning');
        return;
      }

      let options = [];
      let correctAnswer = '';

      if (type === 'mcq') {
        options = [0, 1, 2, 3].map(i => document.getElementById(`q-opt-${i}`).value.trim());
        if (options.some(o => !o)) {
          showToast('من فضلك املأ جميع الاختيارات الأربعة', 'warning');
          return;
        }
        const selectedRadio = document.querySelector('input[name="q-mcq-correct"]:checked');
        const correctIdx = selectedRadio ? Number(selectedRadio.value) : 0;
        correctAnswer = options[correctIdx];
      } else {
        options = ['صح', 'خطأ'];
        const selectedTf = document.querySelector('input[name="q-tf-correct"]:checked');
        correctAnswer = selectedTf ? selectedTf.value : 'صح';
      }

      if (questionId) {
        const qIndex = exam.questions.findIndex(q => q.id === questionId);
        if (qIndex > -1) {
          exam.questions[qIndex] = { id: questionId, type, text, options, correctAnswer, timeLimit, points, reference };
        }
        showToast('تم تعديل السؤال وحفظه سحابياً!', 'success');
      } else {
        exam.questions.push({
          id: 'q_' + Date.now(),
          type,
          text,
          options,
          correctAnswer,
          timeLimit,
          points,
          reference
        });
        showToast('تمت إضافة السؤال للامتحان وحفظه سحابياً!', 'success');
      }

      syncCoreDoc('exams', { list: appState.exams });
      closeModal();
      renderApp();
    }

    function deleteQuestion(examId, questionId) {
      if (!hasPerm('manageExams')) return;
      const exam = appState.exams.find(e => e.id === examId);
      if (!exam) return;
      exam.questions = exam.questions.filter(q => q.id !== questionId);
      syncCoreDoc('exams', { list: appState.exams });
      showToast('تم مسح السؤال من الامتحان', 'info');
      renderApp();
    }

    function updatePointsModalTargets(type) {
      const select = document.getElementById('pts-target-id');
      if (!select) return;
      if (type === 'team') {
        select.innerHTML = appState.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      } else {
        const students = appState.users.filter(u => u.role === 'student');
        select.innerHTML = students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      }

    function executePointsAdjustment() {
      const targetType = document.getElementById('pts-target-type').value;
      const targetId = document.getElementById('pts-target-id').value;
      const op = document.getElementById('pts-operation').value;
      const rawAmount = Math.abs(Number(document.getElementById('pts-amount').value) || 0);
      const reason = document.getElementById('pts-reason').value.trim() || (op === 'add' ? 'مكافأة من المستر' : 'خصم إداري من المستر');

      if (!targetId || rawAmount <= 0) {
        showToast('من فضلك حدد الاسم وعدد النقط بشكل صحيح', 'warning');
        return;
      }

      const signedAmount = op === 'add' ? rawAmount : -rawAmount;
      let targetName = '';

      if (targetType === 'team') {
        const team = appState.teams.find(t => t.id === targetId);
        if (!team) return;
        team.manualPoints = (Number(team.manualPoints) || 0) + signedAmount;
        targetName = team.name;
        syncCoreDoc('teams', { list: appState.teams });
      } else {
        const stu = appState.users.find(u => u.id === targetId);
        if (!stu) return;
        stu.manualPoints = (Number(stu.manualPoints) || 0) + signedAmount;
        targetName = stu.name;
        syncCoreDoc('users', { list: appState.users });
      }

      const nowStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      appState.pointsLog.unshift({
        id: 'pl_' + Date.now(),
        targetType,
        targetId,
        targetName,
        amount: signedAmount,
        reason,
        byAdminName: appState.currentUser.name,
        timestamp: `اليوم ${nowStr}`
      });
      syncCoreDoc('pointsLog', { list: appState.pointsLog });

      closeModal();
      showToast(
        signedAmount > 0
          ? `تمت إضافة ${rawAmount} نقطة إلى ${targetName}`
          : `تم خصم ${rawAmount} نقطة من ${targetName}`,
        signedAmount > 0 ? 'success' : 'warning'
      );
      renderApp();
    }

    function clearAllExamAttempts(examId) {
      if (!hasPerm('viewReports') && !hasPerm('manageExams')) return;
      const toRemove = appState.attempts.filter(a => a.examId === examId);
      if (toRemove.length === 0) {
        showToast('لا توجد محاولات مسجلة في هذا الامتحان لتصفيرها.', 'info');
        return;
      }
      toRemove.forEach(a => deleteAttemptFromCloud(a.id));
      appState.attempts = appState.attempts.filter(a => a.examId !== examId);
      showToast('تم تصفير جميع نتائج هذا الامتحان بنجاح!', 'success');

    // يرجع رقم الامتحان المختار فعلاً (ولو المحفوظ قديم أو اتمسح يرجع للامتحان النشط)
    function resolveReportExamId() {
      const ids = appState.exams.map(e => e.id);
      if (ids.includes(appState.selectedExamForReport)) return appState.selectedExamForReport;
      if (ids.includes(appState.settings.activeExamId)) return appState.settings.activeExamId;
      return ids[0] || '';
    }

    function exportReportCSV() {
      const examId = resolveReportExamId();
      const exam = appState.exams.find(e => e.id === examId);
      const attempts = appState.attempts.filter(a => a.examId === examId);

      if (attempts.length === 0) {
        showToast('لا توجد تقارير لتصديرها في هذا الامتحان حتى الآن', 'warning');
        return;
      }

      const headers = ['اسم الطالب', 'الفريق', 'الحالة', 'الدرجة', 'الدرجة النهائية', 'الأخطاء والتفاصيل'];
      const rows = attempts.map(att => {
        const stu = appState.users.find(u => u.id === att.studentId);
        const team = appState.teams.find(t => t.id === stu?.teamId);
        const statusText = att.status === 'kicked_ai' ? `مطرود (${att.kickReason || 'محاولة فتح AI'})` : 'أكمل الامتحان';
        const mistakes = att.answers
          .filter(ans => !ans.isCorrect)
          .map(ans => `[${ans.questionText} -> اختار: ${ans.selectedOption}]`)
          .join(' | ') || 'لا يوجد أخطاء';

        return [
          stu ? stu.name : 'غير معروف',
          team ? team.name : 'بدون فريق',
          statusText,
          att.score,
          att.maxScore,
          mistakes
        ];
      });

      const csvContent = '\uFEFF' + [headers, ...rows]
        .map(e => e.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `تقرير_${exam ? exam.title : 'الامتحان'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('تم تحميل ملف التقرير (Excel CSV) بنجاح!', 'success');
    }

    // --- Branding & Logo Settings (إعدادات اللوجو واسم الموقع) ---
    function handleLogoFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        // Compress image on canvas so it stays lightweight for cloud sync
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 180;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          appState.settings.logoUrl = canvas.toDataURL('image/png', 0.85);
          syncCoreDoc('settings', { payload: appState.settings });
          showToast('تم رفع وتحديث لوجو الخدمة ومزامنته سحابياً!', 'success');
          renderApp();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

              <i class="fa-solid fa-user-check ml-1"></i> تحديث بياناتي وكلمة المرور
            </button>
          </div>

          <div class="glass-card rounded-3xl p-6 border border-slate-800 space-y-5">
            <h3 class="text-xl font-black text-white flex items-center gap-2 border-b border-slate-800 pb-3">
              <i class="fa-solid fa-palette text-amber-400"></i>
              <span>إعدادات اسم الموقع واللوجو والحماية</span>
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">اسم المنصة / الخدمة</label>
                <input id="setting-platform-name" type="text" value="${appState.settings.platformName}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold outline-none focus:border-amber-500" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">الوصف الفرعي تحت الاسم</label>
                <input id="setting-platform-sub" type="text" value="${appState.settings.subtitle}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-amber-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">رابط المنصة المخصص للمشاركة في رسائل الواتساب (اختياري):</label>
              <input id="setting-custom-public-url" type="url" value="${appState.settings.customPublicUrl || ''}" placeholder="اتركه فارغاً لاستخدام الرابط الحالي تلقائياً" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-amber-300 font-mono text-xs outline-none" dir="ltr" />
            </div>

            <!-- Logo Customization -->
            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-4">
              <div class="flex flex-wrap items-center gap-4">
                <img src="${appState.settings.logoUrl}" alt="Current Logo" class="w-16 h-16 rounded-2xl object-cover border-2 border-amber-500 bg-slate-950 p-1" />
                <div class="space-y-1 flex-1">
                  <div class="font-bold text-white text-sm">لوجو الخدمة والكنيسة</div>
                  <p class="text-xs text-slate-400">يمكنك رفع صورة لوجو الكنيسة من جهازك أو اختيار شعار جاهز أو وضع رابط صورة.</p>
                  <label class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 text-xs font-bold cursor-pointer transition mt-1">
                    <i class="fa-solid fa-upload"></i>
                    <span>رفع صورة لوجو من جهازك</span>
                    <input type="file" accept="image/*" onchange="handleLogoFileUpload(event)" class="hidden" />
                  </label>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-slate-800">
                <span class="text-xs text-slate-400">أو اختر شعاراً مسيحياً جاهزاً:</span>
                <button type="button" onclick="selectPresetLogo('bible_cross')" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-300">📖 الكتاب المقدس والصليب</button>
                <button type="button" onclick="selectPresetLogo('crown_faith')" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-300">👑 إكليل الإيمان</button>
                <button type="button" onclick="selectPresetLogo('shield_word')" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-300">🛡️ ترس الكلمة</button>
              </div>

              <div>
                <label class="block text-xs text-slate-400 mb-1">أو ضع رابط مباشر لصورة اللوجو (اختياري):</label>
                <input id="setting-custom-logo-url" type="url" placeholder="https://example.com/logo.png" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300 outline-none" dir="ltr" />
              </div>
            </div>

            <!-- Security & Leaderboard Toggles -->
            <div class="space-y-3 pt-2">
              <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-900/70 border border-slate-800 cursor-pointer">
                <input id="setting-anticheat" type="checkbox" ${appState.settings.antiCheatEnabled ? 'checked' : ''} class="w-5 h-5 accent-amber-500 rounded" />
                <div>
                  <div class="font-bold text-white text-sm">تفعيل الحماية الصارمة ضد فتح أي AI أو الخروج من شاشة الامتحان</div>
                  <div class="text-xs text-slate-400">يطرد الطالب فوراً ويغلق امتحانه إذا انتقل لأي نافذة أو تطبيق آخر</div>
                </div>
              </label>

              <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-900/70 border border-slate-800 cursor-pointer">
                <input id="setting-show-lb" type="checkbox" ${appState.settings.showLeaderboardToStudents ? 'checked' : ''} class="w-5 h-5 accent-amber-500 rounded" />
                <div>
                  <div class="font-bold text-white text-sm">إظهار جدول ترتيب الفرق والأولاد في صفحة الطلاب</div>
                  <div class="text-xs text-slate-400">يمكنك إخفاؤه إذا أردت جعل النتيجة مفاجأة في نهاية المسابقة</div>
                </div>
              </label>

              <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-900/70 border border-slate-800 cursor-pointer">
                <input id="setting-show-demo" type="checkbox" ${appState.settings.showDemoLoginHelper ? 'checked' : ''} class="w-5 h-5 accent-amber-500 rounded" />
                <div>
                  <div class="font-bold text-white text-sm">إظهار صندوق "تجربة سريعة للحسابات" في شاشة تسجيل الدخول</div>
                  <div class="text-xs text-amber-300">أغلق هذا الخيار قبل إرسال اللينك للأولاد حتى لا يظهر لهم سوى مربع كتابة اليوزر والباسورد فقط</div>
                </div>
              </label>
            </div>

            <button onclick="saveBrandingSettings()" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base shadow-lg transition">
              <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ كافة الإعدادات ومزامنتها
            </button>
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 8. MAIN APP RENDER DISPATCHER
     *************************************************************************/
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      // 1. If not logged in -> show Login Screen
      if (!appState.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      // 2. If a student is currently inside an active exam session -> show Focus Exam Screen
      if (appState.currentUser.role === 'student' && appState.examSession) {
        app.innerHTML = renderActiveExamView();
        return;
      }

      // 3. If logged in as Student -> show Student Portal
      if (appState.currentUser.role === 'student') {
        abandonStaleAttempts();
        app.innerHTML = renderStudentPortal();
        return;
      }

      // 4. Otherwise (super_admin or sub_admin) -> show Admin Dashboard
      app.innerHTML = renderAdminDashboard();
    }

    // Start app as soon as the page structure is ready (do not wait for fonts/CDNs)
    function bootApp() {
      renderApp();
      if (typeof window.initCloudSync === 'function') {
        window.initCloudSync();
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
